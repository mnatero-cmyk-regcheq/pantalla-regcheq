<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla Regcheq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  CLAVE: "",                    // solo si pusiste una CLAVE en Codigo.gs

  CLIMA: { lat: -33.42, lon: -70.60, ciudad: "Santiago" },  // respaldo si Apps Script no trae el clima
  MINUTOS_ACTUALIZACION: 2,
  SEGUNDOS_EVENTOS_Y_ANUNCIOS: 8,          // eventos y anuncios
  SEGUNDOS_SALAS_CUMPLES_ESTACIONAMIENTOS: 4  // salas, cumpleaños y estacionamientos
};

<style>
/* Varios cuadros a la vez; cada cuadro muestra un solo elemento en grande y rota por su cuenta.
   Izquierda: eventos (grande) + anuncios. Derecha: salas + cumpleaños. Abajo: estacionamientos. */
:root{
  --bg:#02001d; --panel:#08063d; --panel-2:#110f52; --line:#1f1c66;
  --text:#ffffff; --muted:#c4c3d6; --dim:#8c8aa9;
  --blue:#0064e0; --blue-l:#5497ea;
  --green:#16e398; --red:#fd6d63; --yellow:#ffcf2f; --fuchsia:#de6ba4; --sky:#49bdf3; --mint:#4ee9b0;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;cursor:none}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;-webkit-transform-origin:0 0;transform-origin:0 0;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:24px;padding:36px 52px 32px}
#stage::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 560px at 88% -12%,rgba(0,100,224,.28),transparent 62%)}

/* Encabezado */
header{display:flex;align-items:center;justify-content:space-between;height:110px}
header img{height:62px;width:auto;display:block}
.hright{display:flex;align-items:center;gap:44px}
.weather{display:flex;align-items:center;gap:18px}
.weather svg{width:78px;height:78px}
.weather .t{font-size:84px;font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.weather .d{font-size:21px;color:var(--muted);margin-top:6px;font-weight:500}
.sep{width:2px;height:92px;background:var(--line)}
.clock{text-align:right}
.clock .time{font-size:96px;font-weight:800;letter-spacing:-.045em;line-height:.88;font-variant-numeric:tabular-nums}
.clock .date{font-size:22px;color:var(--muted);margin-top:8px;font-weight:500}

/* Cuadros */
main{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:24px;min-height:0}
main.solo{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:24px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;position:relative;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.card .hd{display:flex;align-items:center;gap:12px;padding:26px 32px 0;font-size:21px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card .hd svg{width:28px;height:28px;flex:0 0 auto}
.card .hd .cnt{margin-left:auto;font-size:20px;letter-spacing:0;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums}
.card .vp{position:relative;flex:1;min-height:0}
.item{position:absolute;top:0;right:0;bottom:0;left:0;padding:12px 32px 30px;display:flex;align-items:center;opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease}
.item.on{opacity:1;transform:none}
#events{flex:1}
#ads{flex:0 0 250px}
#rooms,#bdays{flex:1}

/* Evento */
.ev{display:flex;align-items:center;gap:44px;width:100%;min-width:0}
.datebox{flex:0 0 250px;height:250px;border-radius:30px;background:var(--panel-2);border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.datebox .rel{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.datebox .num{font-size:118px;font-weight:800;line-height:.95;letter-spacing:-.04em}
.datebox .mo{font-size:28px;font-weight:600;color:var(--muted)}
.evtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.pills{display:flex;gap:12px}
.cat{font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px;border-radius:999px;
  color:var(--c);background:rgba(255,255,255,.08);background:color-mix(in srgb,var(--c) 16%,transparent);border:2px solid rgba(255,255,255,.25);border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.now{font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px;border-radius:999px;background:var(--green);color:var(--bg)}
.big{font-size:70px;font-weight:800;line-height:1.05;letter-spacing:-.025em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big.m{font-size:60px}.big.s{font-size:50px}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;font-size:32px;font-weight:600;color:var(--muted)}
.facts span{display:inline-flex;align-items:center;gap:12px;min-width:0}
.facts svg{width:34px;height:34px;flex:0 0 auto;color:var(--dim)}

/* Anuncio */
.ad{display:flex;align-items:center;gap:36px;width:100%;min-width:0}
.orb{flex:0 0 150px;height:150px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.orb svg{width:76px;height:76px}
.orb.img{flex-basis:260px;border-radius:20px;background:var(--panel-2) center/cover no-repeat}
.ad .tx{min-width:0;display:flex;flex-direction:column;gap:10px}
.ad h3{font-size:46px;font-weight:800;line-height:1.08;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad h3.s{font-size:38px}
.ad p{font-size:26px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Sala */
.room{width:100%;min-width:0;display:flex;flex-direction:column;gap:14px}
.room .nm{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .cap{font-size:24px;color:var(--dim);font-weight:500}
.state{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;font-size:40px;font-weight:800;padding:10px 26px;border-radius:999px;
  color:var(--c);background:rgba(255,255,255,.08);background:color-mix(in srgb,var(--c) 15%,transparent)}
.state i{width:18px;height:18px;border-radius:50%;background:currentColor}
.room .when{font-size:30px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

/* Cumpleaños */
.bd{width:100%;min-width:0;display:flex;align-items:center;gap:28px}
.bd .day{flex:0 0 150px;height:150px;border-radius:24px;background:var(--panel-2);border:3px solid var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bd .day b{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--yellow)}
.bd .day span{font-size:70px;font-weight:800;line-height:1}
.bd .tx{min-width:0;display:flex;flex-direction:column;gap:8px}
.bd .n{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd .a{font-size:26px;color:var(--muted);font-weight:500}
.bd.today .day{background:var(--yellow)}
.bd.today .day b,.bd.today .day span{color:var(--bg)}

/* Estacionamientos */
#park{flex-direction:row;align-items:stretch;height:96px;border-radius:22px}
#park .lbl{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 30px;background:var(--panel-2);border-right:1px solid var(--line)}
#park .lbl svg{width:40px;height:40px;color:var(--blue-l)}
#park .lbl b{display:block;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-l)}
#park .lbl span{font-size:22px;font-weight:600}
#park .vp{flex:1}
#park .item{padding:0 32px}
.pk{display:flex;align-items:baseline;gap:26px;white-space:nowrap;min-width:0}
.pk b{font-size:38px;font-weight:800}
.pk span{font-size:34px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pk em{font-style:normal;font-size:32px;color:var(--dim);font-variant-numeric:tabular-nums}
#park .cnt{display:flex;align-items:center;padding:0 30px;font-size:20px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}

.empty{font-size:28px;color:var(--dim)}
#status{position:absolute;left:50%;transform:translateX(-50%);top:10px;font-size:15px;color:var(--dim);z-index:5}
.hidden{display:none!important}
</style>
</head>

  return {iso:o.year+"-"+o.month+"-"+o.day, hm:(o.hour==="24"?"00":o.hour)+":"+o.minute};
}

function addDays(iso,n){ var p=iso.split("-"); return new Date(Date.UTC(+p[0],p[1]-1,+p[2]+n)).toISOString().slice(0,10); }

/* ---------- Cuadro que rota: un elemento a la vez ---------- */
function Rotator(id, offset, secs){
  this.box=$(id); this.vp=this.box.querySelector(".vp"); this.cnt=this.box.querySelector(".cnt"); 
  this.items=[]; this.idx=-1; this.offset=offset; this.secs=secs; this.started=false; this.sig="";
}
Rotator.prototype.set=function(items){
  var keys=items.map(function(x){ return x.key; }).join("|");
  var curKey=this.items[this.idx] && this.items[this.idx].key;
  this.items=items;
  this.box.classList.toggle("hidden", !items.length);
  if (keys===this.sig){ this.refresh(); return; }       // mismos elementos: solo actualiza lo que se ve
  this.sig=keys;
  var k=-1; for (var i=0;i<items.length;i++) if (items[i].key===curKey) k=i;
  if (k>-1){ this.idx=k; this.refresh(); this.count(); return; }
  this.idx=-1; this.show();
  if (!this.started){ this.started=true; var me=this; setTimeout(function(){ me.show(); setInterval(function(){ me.show(); }, me.secs*1000); }, this.secs*1000+this.offset); }
};
Rotator.prototype.show=function(){
  if (!this.items.length){ this.vp.innerHTML=""; return; }
  var prevIdx=this.idx;
  this.idx=(this.idx+1)%this.items.length;
  if (prevIdx===this.idx && this.vp.firstChild){ this.refresh(); return; }   // un solo elemento: no parpadea
  // Saca todo lo anterior: lo que ya iba saliendo se borra al tiro y lo visible se desvanece.
  // No usa requestAnimationFrame: si la ventana queda en segundo plano, el navegador lo pausa
  // y al volver se mostraban varios elementos encima.
  var vp=this.vp;
  [].slice.call(vp.children).forEach(function(c){
    if (c.classList.contains("out")) { vp.removeChild(c); return; }
    c.classList.remove("on"); c.classList.add("out");
    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 800);
  });
  var el=document.createElement("div");
  el.className="item"; el.innerHTML=this.items[this.idx].html(); vp.appendChild(el);
  void el.offsetWidth;            // fuerza el estilo inicial para que la transición se vea
  el.classList.add("on");
  this.count();
};
Rotator.prototype.refresh=function(){
  var on=this.vp.querySelector(".item.on:not(.out)")||this.vp.lastChild, it=this.items[this.idx];
  if (on && it){ var h=it.html(); if (on.innerHTML!==h) on.innerHTML=h; }
};
Rotator.prototype.count=function(){ if (this.cnt) this.cnt.textContent = this.items.length>1 ? (this.idx+1)+" de "+this.items.length : ""; };

var KEY="pantalla_regcheq_v5", data=null;
function load(){
  // Dentro de Apps Script (la URL /exec) los datos se piden directo al servidor
  var gs = window.google && google.script && google.script.run;
  if (!gs && !C.DATA_URL){ data=demo(); setStatus("Modo demostración: configura DATA_URL"); render(); return; }
  var ok=function(j){
    if (typeof j==="string") j=JSON.parse(j);
    if (j.error) throw new Error(j.error);
    data=j; try{ localStorage.setItem(KEY,JSON.stringify(j)); }catch(e){} setStatus(""); render();
  };
  var fail=function(err){
    if (data){ setStatus("Sin conexión · mostrando la última versión"); render(); return; }
    var c=null; try{ c=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if (c){ data=c; setStatus("Sin conexión · mostrando la última versión"); } else { data=demo(); setStatus("No se pudieron leer los datos ("+(err&&err.message||err)+")"); }
    render();
  };
  if (gs){
    google.script.run.withSuccessHandler(function(t){ try{ ok(t); }catch(e){ fail(e); } }).withFailureHandler(fail).obtenerDatos(C.CLAVE||"");
    return;
  }
  var u=C.DATA_URL+(C.DATA_URL.indexOf("?")>-1?"&":"?")+"t="+Date.now()+(C.CLAVE?"&key="+encodeURIComponent(C.CLAVE):"");
  fetch(u,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(ok).catch(fail);
}

/* ---------- Clima ---------- */
function wInfo(c,day){
  if (c===0) return [day?"sun":"moon","Despejado"];
  if (c<=2) return [day?"part":"cloud","Parcial nublado"];
  if (c===3) return ["cloud","Nublado"];
  if (c===45||c===48) return ["fog","Neblina"];
  if (c>=95) return ["storm","Tormenta"];
  if ((c>=71&&c<=77)||c===85||c===86) return ["snow","Nieve"];
  if (c>=51) return ["rain","Lluvia"];
  return ["cloud","Nublado"];
}
var directW=null;
function renderWeather(){
  var w=(data&&data.clima)||directW;
  if (!w){ $("weather").innerHTML='<div><div class="t">--°</div><div class="d">Clima no disponible</div></div>'; return; }
  var i=wInfo(w.codigo,w.dia);
  $("weather").innerHTML=I[i[0]]+'<div><div class="t">'+Math.round(w.temp)+'°</div><div class="d">'+esc(C.CLIMA.ciudad)+' · '+i[1]+
    (w.min!=null&&w.max!=null?' · '+Math.round(w.min)+'° / '+Math.round(w.max)+'°':'')+'</div></div>';
}
// Respaldo: si Apps Script no trae el clima, se pide directo a Open-Meteo
function weatherDirect(){
  if (data && data.clima) return;
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+C.CLIMA.lat+"&longitude="+C.CLIMA.lon+"&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone="+encodeURIComponent(C.ZONA_HORARIA))
    .then(function(r){ return r.json(); })
    .then(function(j){ directW={temp:j.current.temperature_2m,codigo:j.current.weather_code,dia:j.current.is_day===1,min:j.daily.temperature_2m_min[0],max:j.daily.temperature_2m_max[0]}; renderWeather(); })
    .catch(function(){});
}

/* ---------- Reloj ---------- */
function tick(){
  var d=new Date();
  $("time").textContent=new Intl.DateTimeFormat("es-CL",{timeZone:C.ZONA_HORARIA,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  $("date").textContent=cap(new Intl.DateTimeFormat("es-CL",{timeZone:C.ZONA_HORARIA,weekday:"long",day:"numeric",month:"long"}).format(d));
}

/* ---------- Arranque ---------- */
tick(); setInterval(tick,1000);
load(); setInterval(load, C.MINUTOS_ACTUALIZACION*60*1000);
setTimeout(weatherDirect, 4000); setInterval(weatherDirect, 15*60*1000);
// Cada 30 s recalcula estados (sala libre/ocupada, "Ahora", eventos terminados, cambio de día)
setInterval(function(){ if (data) render(); }, 30*1000);
})();
</script>
